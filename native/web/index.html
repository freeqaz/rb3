<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Band 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #ccc;
        }
        #canvas-container {
            position: relative;
            height: 80vh;
            width: min(100vw, calc(80vh * 16 / 9));
            max-width: 100vw;
        }
        #rb3-canvas {
            outline: 1px solid #333;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ── Loading overlay ──────────────────────────────────────────────── */
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-logo {
            font-size: clamp(22px, 4vw, 42px);
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            /* RB3 brand: purple-blue with white text shadow — matches title screen */
            color: #ffffff;
            text-shadow:
                0 0 20px #5533ff,
                0 0 40px #3311cc,
                2px 2px 0 #220088,
                -1px -1px 0 #220088;
            margin-bottom: 32px;
            user-select: none;
        }
        .loading-logo span {
            color: #a288ff;
        }
        .progress-track {
            width: 60%;
            min-width: 200px;
            max-width: 480px;
            height: 6px;
            background: #1a1a2a;
            border-radius: 3px;
            border: 1px solid #2a2a4a;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #5533ff 0%, #9966ff 60%, #cc99ff 100%);
            border-radius: 3px;
            transition: width 0.25s ease;
        }
        /* Indeterminate pulse when total is unknown */
        .progress-fill.indeterminate {
            width: 35% !important;
            animation: pulse-slide 1.4s ease-in-out infinite;
        }
        @keyframes pulse-slide {
            0%   { transform: translateX(-100%); opacity: 0.7; }
            50%  { opacity: 1; }
            100% { transform: translateX(300%); opacity: 0.7; }
        }
        .loading-status {
            font-size: 12px;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            min-height: 16px;
        }

        /* ── Status bar below canvas ─────────────────────────────────────── */
        #status {
            margin-top: 12px;
            font-size: 14px;
            color: #888;
        }
        #status.error { color: #e55; }
        #status.ok { color: #5e5; }
        #status.loading { color: #5ae; }
        #controls {
            margin-top: 8px;
            font-size: 12px;
            color: #555;
        }
        #controls span {
            color: #888;
            background: #1a1a1a;
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid #333;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }
        #console {
            margin-top: 8px;
            max-width: 1280px;
            width: 100%;
            max-height: 140px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 11px;
            color: #666;
            background: #111;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #222;
        }
        #console .err { color: #c66; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="rb3-canvas" width="1280" height="720" tabindex="0"></canvas>

        <!-- Loading overlay — sits on top of the canvas during boot -->
        <div id="loading-overlay">
            <div class="loading-logo">Rock <span>Band</span> 3</div>
            <div class="progress-track">
                <div class="progress-fill indeterminate" id="progress-fill"></div>
            </div>
            <div class="loading-status" id="loading-status">Loading WASM...</div>
        </div>
    </div>
    <div id="status">Initializing...</div>
    <div id="controls">
        <span>Enter</span> Confirm &nbsp;
        <span>Space</span> Start &nbsp;
        <span>Esc</span> Cancel &nbsp;
        <span>Tab</span> Option &nbsp;
        <span>↑↓←→</span> / <span>WASD</span> Navigate &nbsp;
        <span>Q</span>/<span>E</span> PageUp/Dn
    </div>
    <div id="console"></div>

    <script>
        const status = document.getElementById('status');
        const logDiv = document.getElementById('console');
        const overlay = document.getElementById('loading-overlay');
        const progressFill = document.getElementById('progress-fill');
        const loadingStatus = document.getElementById('loading-status');

        function log(text, isErr) {
            const line = document.createElement('div');
            line.textContent = text;
            if (isErr) line.className = 'err';
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // ── Loading overlay management ────────────────────────────────────────

        // Phase labels for each boot stage (matched to boot state transitions)
        var loadingPhase = 'wasm';   // 'wasm' | 'assets' | 'engine' | 'done'

        function setLoadingPhase(phase) {
            if (phase === loadingPhase) return;
            loadingPhase = phase;
            switch (phase) {
            case 'wasm':
                loadingStatus.textContent = 'Loading WASM...';
                progressFill.classList.add('indeterminate');
                break;
            case 'assets':
                loadingStatus.textContent = 'Downloading assets...';
                progressFill.classList.add('indeterminate');
                break;
            case 'engine':
                loadingStatus.textContent = 'Booting engine...';
                break;
            case 'done':
                hideOverlay();
                break;
            }
        }

        function setProgress(loaded, total) {
            if (total > 0) {
                progressFill.classList.remove('indeterminate');
                var pct = Math.min(100, Math.round(loaded / total * 100));
                progressFill.style.width = pct + '%';
                loadingStatus.textContent = 'Assets: ' + loaded + ' / ' + total;
            } else if (loaded > 0) {
                // Total unknown yet — keep indeterminate but show count
                loadingStatus.textContent = 'Assets: ' + loaded + ' loaded...';
            }
        }

        function hideOverlay() {
            overlay.classList.add('hidden');
            // Remove from DOM after fade so it doesn't block clicks
            overlay.addEventListener('transitionend', function() {
                overlay.remove();
            }, { once: true });
        }

        // Poll window.rb3* signals from the WASM boot loop
        var overlayPoller = setInterval(function() {
            var booted = window.rb3AppBooted;
            var frameCount = window.rb3FrameCount || 0;
            var loaded = window.rb3AssetsLoaded || 0;
            var total = window.rb3AssetsTotal || 0;

            if (booted || frameCount > 2) {
                // App is running — hide overlay after a brief delay so the first
                // frame is already visible when the overlay fades out.
                clearInterval(overlayPoller);
                setLoadingPhase('done');
                return;
            }

            // Update progress bar from asset counters
            if (loaded > 0 || total > 0) {
                if (loadingPhase === 'wasm' || loadingPhase === 'assets') {
                    setLoadingPhase('assets');
                    setProgress(loaded, total);
                }
            }

            // Transition to 'engine' phase once assets are done (total > 0 means
            // BOOT_FETCHING completed and set the total).
            if (total > 0 && loaded >= total && loadingPhase === 'assets') {
                setLoadingPhase('engine');
                progressFill.classList.remove('indeterminate');
                progressFill.style.width = '95%';
            }
        }, 100);  // 10 Hz poll — lightweight

        // ── WebGPU gate ───────────────────────────────────────────────────────

        if (!navigator.gpu) {
            const ua = navigator.userAgent;
            const isFirefox = /Firefox/.test(ua);
            const isChromium = /Chrom(e|ium)/.test(ua);
            const browserHelp = isFirefox
                ? 'Firefox: WebGPU requires Nightly with <code>dom.webgpu.enabled=true</code> in <code>about:config</code>.'
                : isChromium
                ? 'Chrome/Chromium on Linux: launch with <code>--enable-unsafe-webgpu --enable-features=Vulkan</code>, or toggle <code>chrome://flags/#enable-unsafe-webgpu</code>.'
                : 'Use a Chromium-based browser with WebGPU enabled, or Firefox Nightly with <code>dom.webgpu.enabled</code>.';
            status.innerHTML =
                '<strong>WebGPU not available in this browser.</strong><br>' +
                '<span style="color:#aaa">RB3 needs WebGPU to render. ' + browserHelp + '</span>';
            status.className = 'error';
            status.style.maxWidth = '900px';
            status.style.textAlign = 'center';
            log('WebGPU not available — refusing to boot engine (would render black)', true);
            // Update overlay to show the error state
            loadingStatus.textContent = 'WebGPU not available — see status below';
            progressFill.classList.remove('indeterminate');
            progressFill.style.width = '0%';
            throw new Error('WebGPU unavailable');
        }
        {
            status.textContent = 'Loading WASM...';
            status.className = 'loading';

            var wasmReady = false;
            var Module = {
                canvas: document.getElementById('rb3-canvas'),
                onRuntimeInitialized: function() {
                    wasmReady = true;
                    console.log('RUNTIME_INIT_OK');
                    status.textContent = 'Downloading assets...';
                    status.className = 'loading';
                    // Advance overlay phase to show asset progress
                    setLoadingPhase('assets');
                },
                print: function(text) {
                    console.log(text);
                    log(text);
                    if (text.includes('assets ready')) {
                        status.textContent = 'Assets loaded, booting engine...';
                        status.className = 'loading';
                        setLoadingPhase('engine');
                    }
                    if (text.includes('GPU ready')) {
                        status.textContent = 'Rendering';
                        status.className = 'ok';
                    }
                    if (text.includes('InitGpu FAILED') || text.includes('GPU not ready')) {
                        status.textContent = 'GPU not available — see console';
                        status.className = 'error';
                    }
                },
                printErr: function(text) {
                    console.error(text);
                    log(text, true);
                    if (text.includes('adapter request failed') ||
                        text.includes('device request failed') ||
                        text.includes('device lost')) {
                        status.textContent = 'GPU error — see console';
                        status.className = 'error';
                    }
                }
            };

            console.log('LOADING_WASM_JS');
            var script = document.createElement('script');
            script.src = 'rb3-web.js';
            script.onload = function() {
                console.log('WASM_JS_LOADED');
            };
            script.onerror = function(e) {
                console.error('WASM_JS_ERROR: ' + e);
                status.textContent = 'Failed to load rb3-web.js — build first (scripts/web/build.sh)';
                status.className = 'error';
                loadingStatus.textContent = 'Failed to load rb3-web.js';
                progressFill.classList.remove('indeterminate');
            };
            document.body.appendChild(script);
        }

        // Canvas resize — match canvas resolution to display size so the WebGPU
        // surface stays in sync with the visible CSS dimensions.
        (function() {
            var canvas = document.getElementById('rb3-canvas');
            var pending = false;
            function resizeCanvas() {
                var rect = canvas.getBoundingClientRect();
                var w = Math.round(rect.width);
                var h = Math.round(rect.height);
                if (w <= 0 || h <= 0) return;
                if (canvas.width === w && canvas.height === h) return;
                canvas.width = w;
                canvas.height = h;
                if (wasmReady && Module._rb3_resize_canvas) {
                    Module._rb3_resize_canvas(w, h);
                }
            }
            if (typeof ResizeObserver !== 'undefined') {
                new ResizeObserver(function() {
                    if (!pending) {
                        pending = true;
                        requestAnimationFrame(function() {
                            pending = false;
                            resizeCanvas();
                        });
                    }
                }).observe(canvas);
            }
            window.addEventListener('resize', resizeCanvas);
        })();
    </script>
</body>
</html>
