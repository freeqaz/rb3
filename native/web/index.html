<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Band 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #ccc;
        }
        #canvas-container {
            position: relative;
            height: 80vh;
            width: min(100vw, calc(80vh * 16 / 9));
            max-width: 100vw;
        }
        #rb3-canvas {
            outline: 1px solid #333;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ── Loading overlay ──────────────────────────────────────────────── */
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-logo {
            font-size: clamp(22px, 4vw, 42px);
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            /* RB3 brand: purple-blue with white text shadow — matches title screen */
            color: #ffffff;
            text-shadow:
                0 0 20px #5533ff,
                0 0 40px #3311cc,
                2px 2px 0 #220088,
                -1px -1px 0 #220088;
            margin-bottom: 32px;
            user-select: none;
        }
        .loading-logo span {
            color: #a288ff;
        }
        .progress-track {
            width: 60%;
            min-width: 200px;
            max-width: 480px;
            height: 6px;
            background: #1a1a2a;
            border-radius: 3px;
            border: 1px solid #2a2a4a;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #5533ff 0%, #9966ff 60%, #cc99ff 100%);
            border-radius: 3px;
            transition: width 0.25s ease;
        }
        /* Indeterminate pulse when total is unknown */
        .progress-fill.indeterminate {
            width: 35% !important;
            animation: pulse-slide 1.4s ease-in-out infinite;
        }
        @keyframes pulse-slide {
            0%   { transform: translateX(-100%); opacity: 0.7; }
            50%  { opacity: 1; }
            100% { transform: translateX(300%); opacity: 0.7; }
        }
        .loading-status {
            font-size: 12px;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            min-height: 16px;
        }

        /* ── Status bar below canvas ─────────────────────────────────────── */
        #status {
            margin-top: 12px;
            font-size: 14px;
            color: #888;
        }
        #status.error { color: #e55; }
        #status.ok { color: #5e5; }
        #status.loading { color: #5ae; }
        #controls {
            margin-top: 8px;
            font-size: 12px;
            color: #555;
        }
        #controls span {
            color: #888;
            background: #1a1a1a;
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid #333;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }
        #console {
            margin-top: 8px;
            max-width: 1280px;
            width: 100%;
            max-height: 140px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 11px;
            color: #666;
            background: #111;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #222;
        }
        #console .err { color: #c66; }
    </style>
    <script>
        // Path-prefix shim (2026-07-12): lets this exact build be served
        // unmodified either at the server root (localhost:8421, the app
        // server's native home) OR behind a reverse proxy mounted at a
        // sub-path (e.g. https://home.freeqaz.com/rb3/). The game constructs
        // root-absolute "/api/..." URLs in three places we don't want to
        // touch (rb3_pre.js's telemetry egress, main_web.cpp's EM_ASM asset
        // fetches, WebAssets.cpp's emscripten_fetch/sync XHR) — under a
        // prefix those would resolve to the proxy's ROOT and 404. Instead we
        // derive the mount base from the page's own URL and prefix just the
        // "/api/" calls at the fetch/XHR/beacon layer, before any of that
        // code runs. Everything else on the page (rb3-web.js, the wasm, the
        // audio worklet) already uses paths relative to index.html, so it
        // needs no help — this shim is the one thing standing between
        // "works at /" and "works at /rb3/".
        //
        // base is "" at the server root (index.html or /), so the whole
        // block is a no-op there — zero behavior change on localhost:8421.
        var base = location.pathname.replace(/\/(index\.html)?$/, '');
        if (base) {
            window.__rb3UrlBase = base;

            // Only touch our own root-absolute API surface; anything else
            // (relative build assets, third-party URLs, non-string args)
            // passes through untouched.
            function rb3PrefixApi(url) {
                if (typeof url === 'string' && url.indexOf('/api/') === 0) {
                    return base + url;
                }
                return url;
            }

            var rb3Fetch = window.fetch;
            window.fetch = function(input, init) {
                return rb3Fetch.call(this, rb3PrefixApi(input), init);
            };

            var rb3XhrOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url) {
                var args = Array.prototype.slice.call(arguments);
                args[1] = rb3PrefixApi(url);
                return rb3XhrOpen.apply(this, args);
            };

            if (navigator.sendBeacon) {
                var rb3SendBeacon = navigator.sendBeacon;
                navigator.sendBeacon = function(url, data) {
                    return rb3SendBeacon.call(navigator, rb3PrefixApi(url), data);
                };
            }

            // Fourth call site, found during proxy validation (2026-07-12):
            // rb3_movie_native.cpp's fullscreen-cinematic overlay
            // (rb3_webmovie_create) builds "/api/file/<...>.webm" and assigns
            // it straight to a <video>'s .src — a DOM property write, not a
            // fetch/XHR/beacon call, so it slips past the three patches
            // above. Under a prefix this 404s the intro/credits video.
            // Patch the shared HTMLMediaElement.src setter (covers <video>
            // and <audio>) the same way.
            var rb3MediaSrcDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
            if (rb3MediaSrcDesc && rb3MediaSrcDesc.set) {
                Object.defineProperty(HTMLMediaElement.prototype, 'src', {
                    get: rb3MediaSrcDesc.get,
                    set: function(url) {
                        rb3MediaSrcDesc.set.call(this, rb3PrefixApi(url));
                    },
                    configurable: true
                });
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container">
        <canvas id="rb3-canvas" width="1280" height="720" tabindex="0"></canvas>

        <!-- Loading overlay — sits on top of the canvas during boot -->
        <div id="loading-overlay">
            <div class="loading-logo">Rock <span>Band</span> 3</div>
            <div class="progress-track">
                <div class="progress-fill indeterminate" id="progress-fill"></div>
            </div>
            <div class="loading-status" id="loading-status">Loading WASM...</div>
        </div>
    </div>
    <div id="status">Initializing...</div>
    <div id="controls">
        <span>Enter</span> Confirm &nbsp;
        <span>Space</span> Start &nbsp;
        <span>Esc</span> Cancel &nbsp;
        <span>Tab</span> Option &nbsp;
        <span>↑↓←→</span> / <span>WASD</span> Navigate &nbsp;
        <span>Q</span>/<span>E</span> PageUp/Dn
    </div>
    <div id="console"></div>

    <!-- Session-telemetry WEB EGRESS (Task F / D5 §7) lives in rb3_pre.js's
         "D5 — session-telemetry egress" IIFE block, NOT here. rb3_pre.js is wired
         as a --pre-js (native/CMakeLists.txt) so it is bundled into the deployed
         release/ + debug/ rb3-web.js and runs before _main — early enough to set
         window.__rb3TraceOn from the URL (?trace=0 / ?notrace) before the C++
         recorder reads it back, and to have window.__rb3Trace present when the
         recorder pushes its first NDJSON chunk. Putting it in the already-deployed
         pre-js (rather than a standalone <script src>) avoids a second served file
         + build.sh deploy step. The block drains __rb3Trace to
         POST /api/telemetry/<sid> on a ~5s timer + a sendBeacon tail on teardown. -->

    <script>
        const status = document.getElementById('status');
        const logDiv = document.getElementById('console');
        const overlay = document.getElementById('loading-overlay');
        const progressFill = document.getElementById('progress-fill');
        const loadingStatus = document.getElementById('loading-status');

        // Frame-stall fix (2026-06-20): the old log() did appendChild + a
        // scrollHeight/scrollTop READ on every call. During song load the engine
        // emits hundreds of console lines per frame, so each call (a) forced a
        // synchronous full-document relayout (read-after-write layout thrash) and
        // (b) grew the #console DOM unboundedly (measured: 17,691 nodes, ~3.8s of
        // Layout = 36% of the main thread across the song-start window, ~+4s added
        // load time). New log(): coalesce all lines emitted in one frame into a
        // single rAF-batched DOM write, cap the buffer to MAX_LOG_LINES, and never
        // read layout in the hot path. Purely page-chrome; no engine/match impact.
        var MAX_LOG_LINES = 200;
        var _logPending = [];
        var _logFlushScheduled = false;
        function _flushLog() {
            _logFlushScheduled = false;
            if (!_logPending.length) return;
            var frag = document.createDocumentFragment();
            for (var i = 0; i < _logPending.length; i++) {
                var p = _logPending[i];
                var line = document.createElement('div');
                line.textContent = p.text;
                if (p.isErr) line.className = 'err';
                frag.appendChild(line);
            }
            _logPending.length = 0;
            logDiv.appendChild(frag);
            // Cap DOM size: drop oldest lines past the cap (bounded relayout cost).
            while (logDiv.childElementCount > MAX_LOG_LINES && logDiv.firstChild)
                logDiv.removeChild(logDiv.firstChild);
            // Single layout read+write per frame (not per line): keep pinned to bottom.
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        function log(text, isErr) {
            _logPending.push({ text: text, isErr: isErr });
            // Hard-cap the in-flight queue too, so a single frame that emits
            // thousands of lines doesn't build a giant fragment.
            if (_logPending.length > MAX_LOG_LINES)
                _logPending.splice(0, _logPending.length - MAX_LOG_LINES);
            if (!_logFlushScheduled) {
                _logFlushScheduled = true;
                requestAnimationFrame(_flushLog);
            }
        }

        // ── Loading overlay management ────────────────────────────────────────

        // Phase labels for each boot stage (matched to boot state transitions)
        var loadingPhase = 'wasm';   // 'wasm' | 'assets' | 'engine' | 'done'

        function setLoadingPhase(phase) {
            if (phase === loadingPhase) return;
            loadingPhase = phase;
            switch (phase) {
            case 'wasm':
                loadingStatus.textContent = 'Loading WASM...';
                progressFill.classList.add('indeterminate');
                break;
            case 'assets':
                loadingStatus.textContent = 'Downloading assets...';
                progressFill.classList.add('indeterminate');
                break;
            case 'engine':
                loadingStatus.textContent = 'Booting engine...';
                break;
            case 'done':
                hideOverlay();
                break;
            }
        }

        function setProgress(loaded, total) {
            if (total > 0) {
                progressFill.classList.remove('indeterminate');
                var pct = Math.min(100, Math.round(loaded / total * 100));
                progressFill.style.width = pct + '%';
                loadingStatus.textContent = 'Assets: ' + loaded + ' / ' + total;
            } else if (loaded > 0) {
                // Total unknown yet — keep indeterminate but show count
                loadingStatus.textContent = 'Assets: ' + loaded + ' loaded...';
            }
        }

        function hideOverlay() {
            overlay.classList.add('hidden');
            // Remove from DOM after fade so it doesn't block clicks
            overlay.addEventListener('transitionend', function() {
                overlay.remove();
            }, { once: true });
        }

        // Poll window.rb3* signals from the WASM boot loop
        var overlayPoller = setInterval(function() {
            var frameCount = window.rb3FrameCount || 0;
            var loaded = window.rb3AssetsLoaded || 0;
            var total = window.rb3AssetsTotal || 0;

            if (frameCount >= 2) {
                // Primary trigger: at least 2 rendered frames means the GPU
                // surface is live — hiding now avoids any black-flash mid-init.
                clearInterval(overlayPoller);
                setLoadingPhase('done');
                return;
            }

            // Update progress bar from asset counters
            if (loaded > 0 || total > 0) {
                if (loadingPhase === 'wasm' || loadingPhase === 'assets') {
                    setLoadingPhase('assets');
                    setProgress(loaded, total);
                }
            }

            // Transition to 'engine' phase once assets are done (total > 0 means
            // BOOT_FETCHING completed and set the total).
            if (total > 0 && loaded >= total && loadingPhase === 'assets') {
                setLoadingPhase('engine');
                progressFill.classList.remove('indeterminate');
                progressFill.style.width = '95%';
            }
        }, 100);  // 10 Hz poll — lightweight

        // ── WebGPU gate ───────────────────────────────────────────────────────

        if (!navigator.gpu) {
            const ua = navigator.userAgent;
            const isFirefox = /Firefox/.test(ua);
            const isChromium = /Chrom(e|ium)/.test(ua);
            const browserHelp = isFirefox
                ? 'Firefox: WebGPU requires Nightly with <code>dom.webgpu.enabled=true</code> in <code>about:config</code>.'
                : isChromium
                ? 'Chrome/Chromium on Linux: launch with <code>--enable-unsafe-webgpu --enable-features=Vulkan</code>, or toggle <code>chrome://flags/#enable-unsafe-webgpu</code>.'
                : 'Use a Chromium-based browser with WebGPU enabled, or Firefox Nightly with <code>dom.webgpu.enabled</code>.';
            status.innerHTML =
                '<strong>WebGPU not available in this browser.</strong><br>' +
                '<span style="color:#aaa">RB3 needs WebGPU to render. ' + browserHelp + '</span>';
            status.className = 'error';
            status.style.maxWidth = '900px';
            status.style.textAlign = 'center';
            log('WebGPU not available — refusing to boot engine (would render black)', true);
            // Update overlay to show the error state
            loadingStatus.textContent = 'WebGPU not available — see status below';
            progressFill.classList.remove('indeterminate');
            progressFill.style.width = '0%';
            throw new Error('WebGPU unavailable');
        }
        {
            status.textContent = 'Loading WASM...';
            status.className = 'loading';

            var wasmReady = false;
            var Module = {
                canvas: document.getElementById('rb3-canvas'),
                onRuntimeInitialized: function() {
                    wasmReady = true;
                    console.log('RUNTIME_INIT_OK');
                    status.textContent = 'Downloading assets...';
                    status.className = 'loading';
                    // Advance overlay phase to show asset progress
                    setLoadingPhase('assets');
                },
                print: function(text) {
                    console.log(text);
                    log(text);
                    if (text.includes('assets ready')) {
                        status.textContent = 'Assets loaded, booting engine...';
                        status.className = 'loading';
                        setLoadingPhase('engine');
                    }
                    if (text.includes('GPU ready')) {
                        status.textContent = 'Rendering';
                        status.className = 'ok';
                    }
                    if (text.includes('InitGpu FAILED') || text.includes('GPU not ready')) {
                        status.textContent = 'GPU not available — see console';
                        status.className = 'error';
                    }
                },
                printErr: function(text) {
                    console.error(text);
                    log(text, true);
                    if (text.includes('adapter request failed') ||
                        text.includes('device request failed') ||
                        text.includes('device lost')) {
                        status.textContent = 'GPU error — see console';
                        status.className = 'error';
                    }
                }
            };

            // ── Build selection: release (default, cached) vs debug ──────────
            // scripts/web/build.sh deploys two builds into sibling subdirs:
            //   release/  — size-opt, -g0, served immutable (fast reloads)
            //   debug/    — -O0 -g2, served no-store (fast iteration)
            // ?debug=true (or ?debug=1) loads debug and bypasses the HTTP cache;
            // anything else loads release. The release URLs are version-stamped
            // with ?v=<token> from /api/version so a rebuilt release wasm busts
            // the immutable cache (the server keys caching off the /release/ path,
            // ignoring the query). If the chosen build isn't deployed we fall
            // back to the other one, so http://host:8421/ works whichever you
            // built.
            var dbgParam = new URLSearchParams(location.search).get('debug');
            var wantDebug = dbgParam !== null &&
                            dbgParam !== '0' && dbgParam !== 'false' && dbgParam !== 'off';

            function loadBuild(dir, version, isFallback) {
                // Only the cached release build needs the version token; debug is
                // no-store so a stale URL can never be served.
                var q = (dir === 'release/' && version) ? ('?v=' + encodeURIComponent(version)) : '';
                Module.locateFile = function(path) { return dir + path + q; };
                console.log('LOADING_WASM_JS (' + dir + (q || '') + ')');
                var script = document.createElement('script');
                script.src = dir + 'rb3-web.js' + q;
                script.onload = function() {
                    console.log('WASM_JS_LOADED (' + dir + ')');
                };
                script.onerror = function(e) {
                    if (!isFallback) {
                        var other = (dir === 'release/') ? 'debug/' : 'release/';
                        console.warn('[rb3] ' + dir + ' build not deployed — falling back to ' + other);
                        loadBuild(other, version, true);
                        return;
                    }
                    console.error('WASM_JS_ERROR: ' + e);
                    status.textContent = 'No build deployed — run scripts/web/build.sh';
                    status.className = 'error';
                    loadingStatus.textContent = 'No build deployed';
                    progressFill.classList.remove('indeterminate');
                };
                document.body.appendChild(script);
            }

            var primaryDir = wantDebug ? 'debug/' : 'release/';
            // Grab the cache-bust token before loading release. Tiny + no-store;
            // worst case (server hiccup) we load with no ?v= and the browser
            // still revalidates. Debug skips the fetch entirely.
            if (wantDebug) {
                loadBuild(primaryDir, '', false);
            } else {
                fetch('/api/version')
                    .then(function(r) { return r.json(); })
                    .then(function(j) { loadBuild(primaryDir, (j && j.version) ? String(j.version) : '', false); })
                    .catch(function() { loadBuild(primaryDir, '', false); });
            }
        }

        // Canvas resize — match canvas resolution to display size so the WebGPU
        // surface stays in sync with the visible CSS dimensions.
        (function() {
            var canvas = document.getElementById('rb3-canvas');
            var pending = false;
            function resizeCanvas() {
                var rect = canvas.getBoundingClientRect();
                var w = Math.round(rect.width);
                var h = Math.round(rect.height);
                if (w <= 0 || h <= 0) return;
                if (canvas.width === w && canvas.height === h) return;
                canvas.width = w;
                canvas.height = h;
                if (wasmReady && Module._rb3_resize_canvas) {
                    Module._rb3_resize_canvas(w, h);
                }
            }
            if (typeof ResizeObserver !== 'undefined') {
                new ResizeObserver(function() {
                    if (!pending) {
                        pending = true;
                        requestAnimationFrame(function() {
                            pending = false;
                            resizeCanvas();
                        });
                    }
                }).observe(canvas);
            }
            window.addEventListener('resize', resizeCanvas);
        })();
    </script>
</body>
</html>
